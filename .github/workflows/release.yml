name: Release

on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish single-file executable
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tags must look like MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH (got '$tag')."
          }
          $version = $Matches.version

          dotnet publish app/Nitrous.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o dist

          if (-not (Test-Path "dist/Nitrous.exe")) {
            throw "Publish did not produce dist/Nitrous.exe"
          }

          $hash = (Get-FileHash "dist/Nitrous.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sumLine = "$hash  Nitrous.exe`n"

          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "dist/SHA256SUMS"),
            $sumLine,
            [System.Text.Encoding]::ASCII)

          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "dist/Nitrous.exe.sha256"),
            $sumLine,
            [System.Text.Encoding]::ASCII)

          Write-Host "Published Nitrous $version ($hash)"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''

          $changelogPath = "CHANGELOG.md"
          if (-not (Test-Path $changelogPath)) {
            throw "CHANGELOG.md is missing; release notes cannot be generated."
          }

          $lines = Get-Content $changelogPath
          $start = -1
          $heading = '^##\s+\[?' + [regex]::Escape($version) + '\]?(\s|$)'
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $heading) { $start = $i; break }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md has no '## $version' section."
          }

          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s') { $end = $i; break }
          }

          $section = ($lines[$start..($end - 1)] -join "`n").TrimEnd()
          if ([string]::IsNullOrWhiteSpace($section)) {
            throw "The changelog section for $version is empty."
          }

          $hash = (Get-Content "dist/Nitrous.exe.sha256" -Raw).Trim().Split(' ')[0]
          if ($hash -notmatch '^[0-9a-f]{64}$') {
            throw "Could not read a SHA-256 digest for Nitrous.exe."
          }

          $footer = @(
            "",
            "---",
            "",
            "### Download",
            "",
            "- ``Nitrous.exe`` is a framework-dependent single-file build for Windows x64.",
            '- Requires the [.NET 10 Desktop Runtime (x64)](https://dotnet.microsoft.com/download/dotnet/10.0).',
            "- ``SHA256: $hash`` (also published in ``SHA256SUMS`` and ``Nitrous.exe.sha256``).",
            '- The executable is not code-signed; the checksums are published so the updater can verify an automatic update and so users can verify a manual download.'
          ) -join "`n"

          $notes = $section + "`n" + $footer

          gh release create "$tag" `
            "dist/Nitrous.exe" `
            "dist/SHA256SUMS" `
            "dist/Nitrous.exe.sha256" `
            --title "Nitrous $version" `
            --notes $notes `
            --verify-tag
